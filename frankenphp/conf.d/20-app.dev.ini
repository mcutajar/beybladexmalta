; See https://docs.docker.com/desktop/features/networking/networking-how-tos/#connect-a-container-to-a-service-on-the-host
; See https://github.com/docker/for-linux/issues/264
; The `client_host` below may optionally be replaced with `discover_client_host=yes`
; Add `start_with_request=yes` to start debug session on each request
xdebug.client_host = host.docker.internal

; PCOV is the coverage driver ("make coverage"), Xdebug is the step debugger.
; Off by default so a plain "make phpunit" pays nothing for it; the coverage
; target turns it on. Confining it to /app/src keeps it from instrumenting
; vendor/, which is the bulk of the loaded code and none of the report.
pcov.enabled = 0
pcov.directory = /app/src
