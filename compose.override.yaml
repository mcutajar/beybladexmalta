services:
  php:
    build:
      context: .
      target: frankenphp_dev
    volumes:
      - ./:/app
      - ./frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - ./frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
      - ./var:/app/var
    environment:
      # Plain HTTP in dev. With a hostname here Caddy serves HTTPS from its own
      # internal CA and 308s port 80 to a port-less `https://localhost` — which
      # lands on whatever holds 443, with a certificate nothing trusts, because
      # frankenphp/Caddyfile sets `skip_install_trust`. Browsers cache that 308
      # permanently, so it outlives the fix. Production uses compose.yaml and is
      # unaffected. Set SERVER_NAME in .env.local to opt back into HTTPS.
      SERVER_NAME: ${SERVER_NAME:-:80}
      XDEBUG_MODE: "${XDEBUG_MODE:-coverage}"
      DATABASE_URL: ${DATABASE_URL}
      FRANKENPHP_WORKER_CONFIG: watch
      CADDY_SERVER_LOG_OPTIONS: "output discard"
    ports:
      - target: 80
        published: ${HTTP_PORT:-80}
        protocol: tcp
      - target: 443
        published: ${HTTPS_PORT:-443}
        protocol: tcp
    tty: true
  
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bbx_malta}
      POSTGRES_USER: ${POSTGRES_USER:-symfony}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMe}
    volumes:
      - ./docker/db_data:/var/lib/postgresql/data
    ports: !override
      - "${DB_PORT:-15432}:5432"
