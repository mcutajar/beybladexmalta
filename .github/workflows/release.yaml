name: Release

# A pushed tag is the only thing that publishes an image, and the image it
# publishes is the only thing production runs. "make release VERSION=1.1.0"
# creates the tag; everything below is what happens next.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

# Never cancelled. A half-finished release leaves a tag with no image behind it,
# and versions are not reused, so the recovery is a whole new number.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The tag has usually already been through CI on main, but "usually" is not a
  # guarantee: a tag can be pushed at any commit by hand, and by the time a bad
  # image is in the registry the version is spent. This job is the gate.
  verify:
    name: Verify the tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Full history, because the ancestry check below needs main.
      - name: Check out the tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # "make release" refuses to tag anything but main, so a tag that is not on
      # main was pushed around it. Releasing one would publish an image nobody
      # can find the source of by reading the default branch.
      - name: Assert the tag is on main
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::${GITHUB_REF_NAME} is not an ancestor of main."
            echo "Releases are cut from main. Delete the tag and use: make release VERSION=..."
            exit 1
          fi

      # ~112 MB that tailwind:build would otherwise download. Same key as ci.yaml
      # so a release reuses whatever the branch runs already warmed.
      - name: Cache the Tailwind binary
        uses: actions/cache@v6
        with:
          path: var/tailwind/*/tailwindcss-*
          key: tailwind-${{ hashFiles('config/packages/symfonycasts_tailwind.yaml') }}

      - name: Start the dev stack
        run: docker compose -f compose.override.yaml up -d --build --wait

      # Coverage is a pull request concern; this run only needs a verdict.
      - name: Run the test suite
        run: make phpunit

      - name: Dump the container logs
        if: ${{ failure() }}
        run: docker compose -f compose.override.yaml logs --no-color

  publish:
    name: Publish the image
    needs: verify
    # Production is Docker Desktop on Apple Silicon, so the image it runs has to
    # be linux/arm64. Building it on an arm64 runner keeps that native -- the
    # alternative, QEMU on an amd64 runner, turns a five-minute build into a
    # much longer one to produce the same thing. Only this one platform is
    # published, because only this one platform is deployed; a second
    # architecture belongs here the day something else has to run it.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45

    permissions:
      # The GitHub Release created at the end.
      contents: write
      # Pushing to GHCR. No secret involved: the repository is public, so the
      # package is public, and GITHUB_TOKEN is enough to write it.
      packages: write

    steps:
      # Full history, and for a second reason than the verify job's: git-cliff
      # reads the commits between this tag and the one before it. At the
      # default depth of 1 there is neither a previous tag nor a commit to
      # read, and it renders an empty changelog rather than failing.
      - name: Check out the tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # The registry path has to be lowercase, which the owner/repo pair is not
      # obliged to be. The version drops the tag's "v": tags are vX.Y.Z, image
      # tags are X.Y.Z.
      - name: Name the image
        id: name
        run: |
          {
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "version=${GITHUB_REF_NAME#v}"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No "latest" tag on purpose. Every image is a version and deploys name
      # one, so a moving tag would only ever be a way to deploy something
      # without knowing what it was.
      #
      # provenance is off so the push is a plain single-platform manifest.
      # With it on, the registry gains an "unknown/unknown" entry beside the
      # real image, which reads as a broken listing on the packages page.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: frankenphp_prod
          push: true
          provenance: false
          tags: ${{ steps.name.outputs.image }}:${{ steps.name.outputs.version }}
          build-args: |
            APP_VERSION=${{ steps.name.outputs.version }}
            APP_REVISION=${{ github.sha }}
            APP_BUILD_DATE=${{ steps.name.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image that just went to the registry, booted. It is the same
      # assertion "make verify-deploy" makes after a deploy, made early enough
      # that a broken image never becomes a version somebody has to skip. The
      # entrypoint is bypassed deliberately: it would wait for a database this
      # job has no reason to start.
      - name: Boot the published image
        env:
          IMAGE: ${{ steps.name.outputs.image }}:${{ steps.name.outputs.version }}
        run: |
          docker run --rm --pull=always --entrypoint php "$IMAGE" \
            bin/console about --env=prod > /dev/null
          echo "The published image boots."

      # The notes come from the commits, via cliff.toml, and not from
      # --generate-notes -- which builds its list out of pull request titles
      # instead, mixing the Dependabot bumps into it and throwing away the
      # commit bodies that say why anything was done.
      #
      # This renders the same section "make release" already wrote into
      # CHANGELOG.md before tagging: same config, same commits, same
      # git-cliff. The version is pinned rather than left to the action's
      # default so that stays true; it is the version GIT_CLIFF_IMAGE names in
      # the Makefile.
      - name: Render the release notes from the commits
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          version: v2.13.1
          config: cliff.toml
          args: --latest --strip header

      # The notes arrive through the environment rather than interpolated into
      # the script, so a commit subject cannot end up being read as shell.
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.name.outputs.image }}:${{ steps.name.outputs.version }}
          VERSION: ${{ steps.name.outputs.version }}
          NOTES: ${{ steps.changelog.outputs.content }}
        run: |
          {
            printf 'Image: `%s`\n\n' "$IMAGE"
            printf 'Deploy it from the production checkout with `make deploy VERSION=%s`.\n\n' "$VERSION"
            printf '%s\n' "$NOTES"
          } > "${RUNNER_TEMP}/notes.md"
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "${RUNNER_TEMP}/notes.md"
