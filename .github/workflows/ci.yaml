name: CI

on:
  push:
    branches:
      - main
  pull_request:

# The default for every job. The suite needs nothing from the API; the badge job
# below asks for what it needs on itself.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Compose derives its project namespace, and the tag of any image it
    # builds, from the checkout directory. Pinning it here lets the build step
    # below tag the image Compose will go looking for.
    env:
      COMPOSE_PROJECT_NAME: beybladexmalta

    # Read by the badge job below, which has no test run of its own.
    outputs:
      coverage: ${{ steps.coverage.outputs.percent }}
      color: ${{ steps.coverage.outputs.color }}

    steps:
      - name: Check out the code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # ~112 MB that tailwind:build would otherwise download on every run. Only
      # the binary is cached: the built stylesheet is a product of the templates,
      # and `make phpunit` rebuilds it only when it is missing, so a restored one
      # would go stale without ever being noticed.
      - name: Cache the Tailwind binary
        uses: actions/cache@v4
        with:
          path: var/tailwind/*/tailwindcss-*
          key: tailwind-${{ hashFiles('config/packages/symfonycasts_tailwind.yaml') }}

      - name: Set up buildx
        uses: docker/setup-buildx-action@v4

      # Built here rather than by `compose up --build`, which drives buildx
      # through the "docker" driver and so cannot export a layer cache. The dev
      # image's two apt layers are ~85s of a ~95s cold build and depend on
      # nothing but the Dockerfile, so caching them across runs is most of it.
      #
      # The tag is the name Compose derives for a built service image,
      # <project>-<service>; the COMPOSE_PROJECT_NAME on this job pins it so it
      # cannot drift with the checkout directory. `up` without `--build` then
      # finds this image already loaded. If the name ever stops matching,
      # Compose builds it itself -- slower, but still the right image.
      - name: Build the dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: frankenphp_dev
          tags: beybladexmalta-php:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The same stack a developer runs, so a Dockerfile or base image bump is
      # tested as well as composer.lock. The entrypoint installs the proposed
      # dependencies and waits for Postgres before the container reports healthy.
      - name: Start the dev stack
        run: docker compose -f compose.override.yaml up -d --wait

      # This step used to be 4:51 of a 7:07 job. Two things account for nearly
      # all of it, neither of them the tests themselves:
      #
      #   - Foundry's ResetDatabase dropped and recreated the whole schema
      #     before every one of the 531 tests. dama/doctrine-test-bundle now
      #     wraps each test in a transaction and rolls it back instead.
      #   - Coverage was measured by Xdebug, which instruments every opcode.
      #     `make coverage` uses PCOV, which the dev image ships disabled.
      #
      # Locally that is 116s -> 18s, for a line rate within 0.2pp. A failing
      # suite stops here and the reporting steps below are skipped with it --
      # coverage from a red run says nothing useful.
      - name: Run the test suite with coverage
        run: make coverage

      # Turns the Cobertura report into a markdown table, one row per file, at
      # code-coverage-results.md in the workspace.
      - name: Summarise the coverage
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: var/coverage/cobertura.xml
          format: markdown
          output: file
          badge: true
          indicators: true
          # PCOV measures lines and nothing else, so the column would read a
          # flat 0%. Branch coverage would mean going back to Xdebug under
          # --path-coverage, which is slower again than the plain Xdebug run
          # this replaced.
          hide_branch_rate: true
          hide_complexity: true
          thresholds: '60 80'

      # The job summary is the only place the table is published. It used to be
      # posted as a pull request comment as well, which put a hundred-odd rows
      # into the review thread on every push; the summary carries the same
      # numbers without crowding the conversation.
      - name: Publish the coverage in the job summary
        run: |
          {
            echo '## Test coverage'
            echo
            cat code-coverage-results.md
            echo
            echo 'Line-by-line detail is in the `coverage-html` artifact on this run.'
          } >> "$GITHUB_STEP_SUMMARY"

      # Cobertura states the line rate as a fraction on the root element. The
      # same number the table shows, rounded once, here so the badge and the
      # summary can never disagree.
      - name: Read the coverage percentage
        id: coverage
        run: |
          rate=$(sed -n 's/.*<coverage line-rate="\([0-9.]*\)".*/\1/p' var/coverage/cobertura.xml | head -1)
          pct=$(awk -v r="$rate" 'BEGIN{printf "%d", r*100+0.5}')
          color=$(awk -v p="$pct" 'BEGIN{print (p<60)?"red":(p<80)?"yellow":"brightgreen"}')
          echo "percent=$pct" >> "$GITHUB_OUTPUT"
          echo "color=$color" >> "$GITHUB_OUTPUT"

      # The percentages say how much is covered; this says which lines are not.
      - name: Upload the line-by-line report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: var/coverage/html
          retention-days: 14

      - name: Dump the container logs
        if: ${{ failure() }}
        run: docker compose -f compose.override.yaml logs --no-color

  # The README badge needs a value that outlives a single run, so main publishes
  # one to the "badges" orphan branch and shields.io reads it from there. The
  # branch holds nothing but coverage.json, which keeps main's history free of
  # badge commits, and no third-party service holds the number.
  badge:
    name: Coverage badge
    needs: phpunit
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      # Unlike the job above this one keeps its credentials: it has a commit to
      # push, and only to a branch that holds a single generated file.
      - name: Check out the badge branch
        uses: actions/checkout@v5
        with:
          ref: badges

      # Through the environment rather than interpolated into the script, so the
      # job body stays free of expansions from another job's output.
      - name: Write the endpoint JSON
        env:
          PERCENT: ${{ needs.phpunit.outputs.coverage }}
          COLOR: ${{ needs.phpunit.outputs.color }}
        run: |
          printf '{\n  "schemaVersion": 1,\n  "label": "coverage",\n  "message": "%s%%",\n  "color": "%s"\n}\n' \
            "$PERCENT" "$COLOR" > coverage.json

      - name: Push it when the number moved
        env:
          PERCENT: ${{ needs.phpunit.outputs.coverage }}
        run: |
          if git diff --quiet -- coverage.json; then
            echo "The badge already reads ${PERCENT}%, so there is nothing to push."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m "chore: coverage is ${PERCENT}%" -- coverage.json
          git push
