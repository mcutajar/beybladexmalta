name: CI

on:
  push:
    branches:
      - main
  pull_request:

# The default for every job. The suite itself needs nothing from the API; the
# coverage comment does, and asks for it on the one job that posts it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      # Only so the coverage table can be posted as a pull request comment. A
      # run from a fork, or from Dependabot, is handed a read-only token no
      # matter what this says, which is why the comment step is skipped there
      # rather than left to fail: the job summary and the artifact still carry
      # the same numbers.
      pull-requests: write

    steps:
      - name: Check out the code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # ~112 MB that tailwind:build would otherwise download on every run. Only
      # the binary is cached: the built stylesheet is a product of the templates,
      # and `make phpunit` rebuilds it only when it is missing, so a restored one
      # would go stale without ever being noticed.
      - name: Cache the Tailwind binary
        uses: actions/cache@v4
        with:
          path: var/tailwind/*/tailwindcss-*
          key: tailwind-${{ hashFiles('config/packages/symfonycasts_tailwind.yaml') }}

      # The same stack a developer runs, so a Dockerfile or base image bump is
      # tested as well as composer.lock. The entrypoint installs the proposed
      # dependencies and waits for Postgres before the container reports healthy.
      - name: Start the dev stack
        run: docker compose -f compose.override.yaml up -d --build --wait

      # Xdebug is already in the image and compose.override.yaml already runs it
      # in coverage mode, so measuring costs this job nothing it was not already
      # paying. A failing suite stops here and the reporting steps below are
      # skipped with it -- coverage from a red run says nothing useful.
      - name: Run the test suite with coverage
        run: make coverage

      # Turns the Cobertura report into a markdown table, one row per file, at
      # code-coverage-results.md in the workspace.
      - name: Summarise the coverage
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: var/coverage/cobertura.xml
          format: markdown
          output: file
          badge: true
          indicators: true
          # PHPUnit only records branches under --path-coverage, which Xdebug
          # makes several times slower, so the column would read a flat 0%.
          hide_branch_rate: true
          hide_complexity: true
          thresholds: '60 80'

      # One file for both readers, so the comment and the summary cannot drift.
      - name: Title the coverage report
        run: |
          {
            echo '## Test coverage'
            echo
            cat code-coverage-results.md
            echo
            echo 'Line-by-line detail is in the `coverage-html` artifact on this run.'
          } > coverage-comment.md
          cat coverage-comment.md >> "$GITHUB_STEP_SUMMARY"

      # A single comment per pull request, edited in place on every push rather
      # than added to, so the thread keeps one current set of numbers.
      - name: Comment the coverage on the pull request
        if: >-
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.actor != 'dependabot[bot]'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: coverage
          path: coverage-comment.md

      # The percentages say how much is covered; this says which lines are not.
      - name: Upload the line-by-line report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: var/coverage/html
          retention-days: 14

      - name: Dump the container logs
        if: ${{ failure() }}
        run: docker compose -f compose.override.yaml logs --no-color
