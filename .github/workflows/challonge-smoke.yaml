name: Challonge smoke check

# `/module` is an embed endpoint, not a documented API. It is the only road in
# while the official API is unusable, and Challonge owes nobody notice before
# changing it. This is how that change surfaces on a Wednesday morning rather
# than in the middle of an event on Saturday night.
on:
  schedule:
    # Wednesdays, 06:00 UTC. Events are held at the weekend, so a failure here
    # leaves three days to do something about it.
    - cron: '0 6 * * 3'
  workflow_dispatch:
    inputs:
      bracket:
        description: 'A bracket URL to check instead of the known one'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: challonge-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Read a known bracket
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      # Only so a failure can raise an issue. A scheduled run nobody is
      # watching is worth as much as no run at all.
      issues: write

    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The same stack a developer runs, so what fails here fails the same way
      # locally. Nothing is seeded: the check reads Challonge and writes
      # nothing, so it needs no data of its own.
      - name: Start the dev stack
        run: docker compose -f compose.override.yaml up -d --build --wait

      # Three attempts before this is called a failure. A datacenter IP is the
      # client Challonge's front door is least pleased to see, and a monitor
      # that files an issue for every transient block is a monitor people learn
      # to ignore.
      #
      # The input arrives through the environment rather than interpolated into
      # the script, so a workflow_dispatch cannot smuggle shell into the run.
      - name: Check the module route
        id: smoke
        env:
          BRACKET: ${{ inputs.bracket }}
        run: |
          attempt=1

          while :; do
            if make console ARGS="app:challonge-smoke${BRACKET:+ $BRACKET}" > smoke.log 2>&1; then
              cat smoke.log
              exit 0
            fi

            echo "--- attempt ${attempt} ---"
            cat smoke.log

            if [ "$attempt" -ge 3 ]; then
              exit 1
            fi

            attempt=$((attempt + 1))
            sleep 30
          done

      # Whichever way it went. The checklist is the useful part: the passes
      # either side of a failure say how much of the page is still the page we
      # knew, and a passing run records what it read.
      - name: Put the checklist in the summary
        if: ${{ always() && steps.smoke.outcome != 'skipped' }}
        run: |
          {
            echo '## Challonge smoke check'
            echo
            echo '```'
            cat smoke.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Two failures wear one hat otherwise, and they want different answers.
      # A route change means the page came back and we did not recognise it; a
      # fetch failure means it never came back at all, and says nothing
      # whatsoever about whether Challonge has changed anything.
      #
      # Only one open issue per kind, commented on rather than duplicated, so a
      # breakage that lasts a month does not leave four issues behind. Nothing
      # reopens a closed one: a later change is a different problem wanting a
      # different diagnosis, and deserves its own issue.
      - name: Raise an issue when the check could not be satisfied
        if: ${{ failure() && steps.smoke.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Which of the two this is. The phrase belongs to
          # ChallongeSmokeReport::problem() and nothing else prints it;
          # ChallongeSmokeCheckTest pins it, naming this workflow, so that
          # rewording it here and there stays one change rather than two.
          if grep -q 'is not the page this reads' smoke.log; then
            export TITLE='The Challonge module route no longer reads the way the importer expects'
            SUMMARY='The check reached Challonge and did not recognise what came back. No bracket can be imported until this is understood; the checklist below says how much of the page is still the page we knew.'
          else
            export TITLE='The scheduled Challonge check could not reach Challonge'
            SUMMARY='Three attempts failed before a page could be read, so this says nothing about whether the module route has changed. It is Challonge being unreachable, or the bracket this checks being gone, or Challonge declining to serve a GitHub Actions runner at all -- and if it is the last of those, this check belongs somewhere with a residential address rather than here.'
          fi

          {
            echo "$SUMMARY"
            echo
            echo "Run: $RUN_URL"
            echo
            echo '```'
            cat smoke.log
            echo '```'
          } > issue.md

          existing=$(gh issue list --state open --search "$TITLE in:title" --json number,title \
            --jq "map(select(.title == env.TITLE)) | .[0].number // empty")

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file issue.md
          else
            gh issue create --title "$TITLE" --body-file issue.md --label challonge
          fi

      - name: Dump the container logs
        if: ${{ failure() }}
        run: docker compose -f compose.override.yaml logs --no-color
