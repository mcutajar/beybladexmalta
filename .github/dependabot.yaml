# The "chore(deps)" prefix is what cliff.toml skips on, so a bump stays out of
# the changelog. A plain "chore" prefix would land these in Maintenance beside
# the commits that are actually about the site, which is what the v1.0.0 notes
# looked like.
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
