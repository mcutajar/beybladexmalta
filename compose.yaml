services:
  php:
    image: ${IMAGES_PREFIX:-}app-php
    restart: unless-stopped
    build:
      context: .
      target: frankenphp_prod
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}
      CADDY_SERVER_LOG_OPTIONS: "output discard"
    volumes:
      - /app/var
      - ./var/log:/app/var/log
      - ./var/data:/app/var/data

  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bbx_malta}
      POSTGRES_USER: ${POSTGRES_USER:-symfony}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMe}
    volumes:
      - ./docker/db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  tunnel:
    profiles:
      - production
    image: cloudflare/cloudflared:latest
    container_name: cloudflare_tunnel_sidecar
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-ChangeMe!}
    depends_on:
      - php
