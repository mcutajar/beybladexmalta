# The component gallery. It renders every component in every variant, so it is
# both the reference and the canary: if a component breaks, this page breaks.
#
# Registered outside production on purpose — it is a working tool, not part of
# the site. It needs no controller because it shows no data.
when@dev: &styleguide
    styleguide:
        path: /_styleguide
        controller: Symfony\Bundle\FrameworkBundle\Controller\TemplateController
        defaults:
            template: 'styleguide/index.html.twig'

when@test: *styleguide
