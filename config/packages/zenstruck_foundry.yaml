when@dev: &dev
    # See full configuration: https://symfony.com/bundles/ZenstruckFoundryBundle/current/index.html#full-default-bundle-configuration
    zenstruck_foundry:
        persistence:
            # Flush only once per call of `PersistentObjectFactory::create()`
            flush_once: true

    # The factories and stories live in tests/ (the `make:factory --test` layout),
    # because they extend a dev dependency and have no business in the production
    # autoloader. Registering them as services is not needed for that: none of
    # them takes a constructor argument, so Foundry instantiates them itself.
    # A factory that ever needs a service injected is what this block is for.
    # See https://symfony.com/bundles/ZenstruckFoundryBundle/current/index.html#generate
    #services:
    #    App\Tests\Factory\:
    #        resource: '%kernel.project_dir%/tests/Factory/'
    #        autowire: true
    #        autoconfigure: true

when@test: *dev
